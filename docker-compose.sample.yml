# Sample only. Production compose lives privately on QNAP and is not committed.
services:
  rpmc-superops-mcp:
    build: .
    image: rpmc-superops-mcp:local
    ports:
      - "127.0.0.1:8080:8080"
    environment:
      MCP_TRANSPORT: http
      MCP_HTTP_HOST: 0.0.0.0
      MCP_HTTP_PORT: "8080"
      MCP_AUTH_TOKEN: ${MCP_AUTH_TOKEN}
      MCP_ALLOWED_ORIGINS: ${MCP_ALLOWED_ORIGINS:-}
      MCP_ALLOWED_HOSTS: ${MCP_ALLOWED_HOSTS:-}
      SUPEROPS_API_TOKEN: ${SUPEROPS_API_TOKEN}
      SUPEROPS_SUBDOMAIN: ${SUPEROPS_SUBDOMAIN}
      SUPEROPS_REGION: ${SUPEROPS_REGION:-us}
    restart: unless-stopped
